spring:
  application:
    name: kafka-consumer-stub

  kafka:
    # Адрес Kafka брокера
    bootstrap-servers: localhost:9092

    consumer:
      # Группа потребителей (все консюмеры с одинаковым groupId делят нагрузку)
      group-id: stub-consumer-group

      # Десериализация ключа и значения
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      # Автоматическое подтверждение (auto-commit)
      enable-auto-commit: false

      # Что делать при старте с новой группы:
      # earliest - читать с самого начала
      # latest - читать только новые сообщения
      auto-offset-reset: earliest

      # Максимум сообщений за один poll
      max-poll-records: 500

    listener:
      # Ручное подтверждение (manual ack)
      ack-mode: manual_immediate

      # Количество потоков для обработки
      concurrency: 3

# Настройки приложения
app:
  kafka:
    topic:
      input: stub-input-topic